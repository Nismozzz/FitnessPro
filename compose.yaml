name: fitnesspro

x-backend: &backend
  image: fitnesspro-backend:local
  build: .
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://fitnesspro:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/fitnesspro
    JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  volumes:
    - app_data:/app/data
    - ./config.yml:/app/config.yml:ro

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitnesspro
      POSTGRES_USER: fitnesspro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fitnesspro -d fitnesspro']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    <<: *backend
    command: [python, -m, scripts.bootstrap_docker]
    healthcheck:
      disable: true
    depends_on:
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Only the private Compose network can reach Uvicorn.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      ingest:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s

  frontend:
    build: ./frontend
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  postgres_data:
  app_data:
